<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.widget {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  width: 150px;
  height: 75px;

  box-sizing: border-box;

  background: rgba(255,255,255,0.92);

  border-radius: 18px;

  box-shadow: 0 5px 20px rgba(0,0,0,0.15);

  color: #18323b;
}

.location {
  font-size: 9px;
  font-weight: bold;
  letter-spacing: 2px;
  opacity: .5;
}

.time {
  margin-top: 3px;

  font-size: 27px;
  font-weight: 800;

  line-height: 1;

  font-variant-numeric: tabular-nums;
}

.date {
  margin-top: 5px;

  font-size: 8px;
  font-weight: bold;

  letter-spacing: 1.5px;

  opacity: .4;
}
</style>
</head>

<body>

<div class="widget">

  <div class="location">
    MIAMI, FL
  </div>

  <div class="time" id="time">
    --:--
  </div>

  <div class="date" id="date">
    --
  </div>

</div>

<script>

const days = [
  "DOMINGO",
  "SEGUNDA",
  "TERÇA",
  "QUARTA",
  "QUINTA",
  "SEXTA",
  "SÁBADO"
];

function updateClock() {

  const now = new Date();

  const formatter = new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone: "America/New_York",
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }
  );

  const dateFormatter = new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone: "America/New_York",
      weekday: "long"
    }
  );

  const time = formatter.format(now);

  const weekday = dateFormatter.format(now);

  const weekdayNumber = new Date(
    now.toLocaleString("en-US", {
      timeZone: "America/New_York"
    })
  ).getDay();

  document.getElementById("time").textContent =
    time;

  document.getElementById("date").textContent =
    days[weekdayNumber];

}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
