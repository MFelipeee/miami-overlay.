<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.widget {
  width: 240px;
  padding: 14px 18px;
  box-sizing: border-box;

  background: rgba(15, 25, 27, 0.82);

  border: 1px solid rgba(255,255,255,.18);
  border-radius: 18px;

  color: white;
  box-shadow: 0 8px 28px rgba(0,0,0,.22);
}

.title {
  font-size: 8px;
  font-weight: bold;
  letter-spacing: 1.8px;
  opacity: .55;
}

.song {
  margin-top: 8px;
  font-size: 17px;
  font-weight: 800;
}

.artist {
  margin-top: 4px;
  font-size: 11px;
  opacity: .6;
}
</style>
</head>

<body>

<div class="widget">

  <div class="title">
    ♪ TOCANDO AGORA · NOW PLAYING
  </div>

  <div class="song" id="song">
    Aguardando música...
  </div>

  <div class="artist" id="artist">
    Waiting for music...
  </div>

</div>

</body>
</html>
