<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.widget {
  display: inline-flex;
  flex-direction: column;
  align-items: center;

  padding: 14px 24px;

  background: rgba(20,35,38,0.86);

  border-radius: 18px;

  box-shadow: 0 7px 25px rgba(0,0,0,0.25);

  color: white;

  min-width: 145px;
}

.status {
  display: flex;
  align-items: center;
  gap: 6px;

  font-size: 9px;
  font-weight: bold;

  letter-spacing: 1.5px;

  opacity: .65;
}

.dot {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: #63c7b8;

  box-shadow: 0 0 8px rgba(99,199,184,.8);
}

.time {
  margin-top: 7px;

  font-size: 28px;
  font-weight: 800;

  letter-spacing: 1px;

  font-variant-numeric: tabular-nums;
}

.footer {
  margin-top: 5px;

  font-size: 8px;

  letter-spacing: 1.4px;

  opacity: .4;
}
</style>
</head>

<body>

<div class="widget">

  <div class="status">
    <div class="dot"></div>
    ONLINE
  </div>

  <div class="time" id="time">
    00:00:00
  </div>

  <div class="footer">
    MIAMI LIVE
  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBCUefiPrAgRniWwWl705gzjc1Uf9Gi8KM0",
  authDomain: "miami-96afb.firebaseapp.com",
  projectId: "miami-96afb",
  storageBucket: "miami-96afb.firebasestorage.app",
  messagingSenderId: "357970079680",
  appId: "1:357970079680:web:a2505fee523e05d8e1e225",
  measurementId: "G-TK8LV5MB5N"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ref = doc(db, "live", "controle");


let seconds = 0;

let lastUpdate = Date.now();


function formatTime(totalSeconds) {

  const hours =
    Math.floor(totalSeconds / 3600);

  const minutes =
    Math.floor((totalSeconds % 3600) / 60);

  const secs =
    totalSeconds % 60;

  return (
    String(hours).padStart(2,"0") + ":" +
    String(minutes).padStart(2,"0") + ":" +
    String(secs).padStart(2,"0")
  );

}


function updateScreen() {

  document.getElementById("time")
    .textContent = formatTime(seconds);

}


onSnapshot(ref, (snapshot) => {

  const data = snapshot.data();

  if (!data) return;

  seconds = Number(data.segundos) || 0;

  lastUpdate = Date.now();

  updateScreen();

});


setInterval(() => {

  if (seconds > 0) {

    seconds++;

    updateScreen();

  }

}, 1000);

</script>

</body>
</html>
