<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

.overlay {
  position: absolute;
  top: 25px;
  left: 25px;
  width: 300px;
  padding: 18px;
  border-radius: 18px;
  background: rgba(10,10,15,.82);
  border: 1px solid rgba(255,255,255,.15);
}

.title {
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1.5px;
  opacity: .75;
}

.money {
  font-size: 34px;
  font-weight: 800;
  margin: 5px 0 12px;
}

.goal {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 6px;
}

.progress {
  height: 8px;
  background: rgba(255,255,255,.15);
  border-radius: 10px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  background: white;
  border-radius: 10px;
}

.info {
  display: flex;
  justify-content: space-between;
  padding-top: 12px;
  margin-top: 15px;
  border-top: 1px solid rgba(255,255,255,.12);
}

.item {
  text-align: center;
}

.label {
  font-size: 11px;
  opacity: .6;
  margin-bottom: 4px;
}

.value {
  font-size: 18px;
  font-weight: bold;
}

.bottom {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,.12);
  font-size: 12px;
  opacity: .85;
}
</style>
</head>

<body>

<div class="overlay">

  <div class="title">GANHOS DO DIA</div>

  <div class="money" id="money">$0.00</div>

  <div class="goal">
    <span>🎯 META</span>
    <span id="goal">$150.00</span>
  </div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="info">

    <div class="item">
      <div class="label">🚗 ENTREGAS</div>
      <div class="value" id="deliveries">0</div>
    </div>

    <div class="item">
      <div class="label">⏱ TRABALHO</div>
      <div class="value" id="timer">00:00:00</div>
    </div>

  </div>

  <div class="bottom">
    <span>📍 MIAMI, FL</span>
    <span id="clock">--:--</span>
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==============================
   FIREBASE
   ============================== */

const firebaseConfig = {
  apiKey: "AIzaSyBCUefiPrAgRniWwWl705gzjc1Uf9Gi8KM0",
  authDomain: "miami-96afb.firebaseapp.com",
  projectId: "miami-96afb",
  storageBucket: "miami-96afb.firebasestorage.app",
  messagingSenderId: "357970079680",
  appId: "1:357970079680:web:a2505fee523e05d8e1e225",
  measurementId: "G-TK8LV5MB5N"
};

  




const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const controleRef = doc(db, "live", "controle");


/* ==============================
   RECEBER DADOS
   ============================== */

onSnapshot(controleRef, (snapshot) => {

  if (!snapshot.exists()) return;

  const data = snapshot.data();

  const money = Number(data.ganhos) || 0;
  const deliveries = Number(data.entregas) || 0;
  const goal = Number(data.meta) || 150;
  const seconds = Number(data.segundos) || 0;


  document.getElementById("money").textContent =
    "$" + money.toFixed(2);


  document.getElementById("deliveries").textContent =
    deliveries;


  document.getElementById("goal").textContent =
    "$" + goal.toFixed(2);


  let percent = goal > 0
    ? (money / goal) * 100
    : 0;

  if (percent > 100) percent = 100;

  document.getElementById("bar").style.width =
    percent + "%";


  let h = Math.floor(seconds / 3600);

  let m = Math.floor((seconds % 3600) / 60);

  let s = seconds % 60;


  document.getElementById("timer").textContent =
    String(h).padStart(2,"0") + ":" +
    String(m).padStart(2,"0") + ":" +
    String(s).padStart(2,"0");

});


/* ==============================
   RELÓGIO MIAMI
   ============================== */

function clock() {

  const now = new Date();

  const options = {
    timeZone: "America/New_York",
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  };

  document.getElementById("clock").textContent =
    new Intl.DateTimeFormat("en-US", options).format(now);

}

clock();

setInterval(clock, 1000);

</script>

</body>
</html>
