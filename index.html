<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

.overlay {
    position: absolute;
    top: 25px;
    left: 25px;
    width: 300px;
    padding: 18px;
    border-radius: 18px;
    background: rgba(10, 10, 15, 0.82);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
}

.title {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    opacity: 0.75;
    margin-bottom: 5px;
}

.money {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 12px;
}

.goal {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
}

.progress {
    height: 8px;
    width: 100%;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
}

.progress-bar {
    height: 100%;
    width: 72%;
    background: white;
    border-radius: 10px;
}

.info {
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.12);
}

.item {
    text-align: center;
}

.label {
    font-size: 11px;
    opacity: 0.6;
    margin-bottom: 4px;
}

.value {
    font-size: 18px;
    font-weight: bold;
}

.bottom {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 12px;
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="overlay">

    <div class="title">GANHOS DO DIA</div>

    <div class="money" id="money">$108.50</div>

    <div class="goal">
        <span>🎯 META</span>
        <span>$150.00</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="info">

        <div class="item">
            <div class="label">🚗 ENTREGAS</div>
            <div class="value">14</div>
        </div>

        <div class="item">
            <div class="label">⏱ TRABALHO</div>
            <div class="value" id="timer">00:00:00</div>
        </div>

    </div>

    <div class="bottom">
        <span>📍 MIAMI, FL</span>
        <span id="clock">--:--</span>
    </div>

</div>

<script>

function updateClock() {

    const now = new Date();

    const options = {
        timeZone: "America/New_York",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    };

    document.getElementById("clock").textContent =
        new Intl.DateTimeFormat("en-US", options).format(now);
}

let seconds = 0;

function updateTimer() {

    seconds++;

    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = seconds % 60;

    h = String(h).padStart(2, "0");
    m = String(m).padStart(2, "0");
    s = String(s).padStart(2, "0");

    document.getElementById("timer").textContent =
        `${h}:${m}:${s}`;
}

updateClock();

setInterval(updateClock, 1000);
setInterval(updateTimer, 1000);

</script>

</body>
</html>
