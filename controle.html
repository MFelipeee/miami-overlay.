
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

.box{
  max-width:420px;
  margin:auto;
  background:#1d1d1d;
  padding:22px;
  border-radius:20px;
}

h1{
  text-align:center;
}

.status{
  text-align:center;
  opacity:.7;
  margin-bottom:20px;
}

.card{
  background:#292929;
  padding:16px;
  margin:12px 0;
  border-radius:15px;
}

.value{
  font-size:28px;
  font-weight:bold;
  margin:8px 0;
}

button{
  padding:12px 16px;
  margin:4px;
  border:0;
  border-radius:10px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  margin:6px 0;
  box-sizing:border-box;
}

.reset{
  width:100%;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>🚗 MIAMI LIVE</h1>

<div class="status">
Painel de controle
</div>

<div class="card">

<div>💵 GANHOS</div>

<div class="value" id="money">$0.00</div>

<button onclick="addMoney(5)">+$5</button>
<button onclick="addMoney(10)">+$10</button>
<button onclick="addMoney(20)">+$20</button>

<input id="moneyInput" type="number" step="0.01" placeholder="Digite o valor">

<button onclick="setMoney()">Atualizar ganhos</button>

</div>


<div class="card">

<div>🚗 ENTREGAS</div>

<div class="value" id="deliveries">0</div>

<button onclick="addDelivery()">+1 ENTREGA</button>

<button onclick="removeDelivery()">-1</button>

</div>


<div class="card">

<div>🎯 META DO DIA</div>

<div class="value" id="goal">$150</div>

<input id="goalInput" type="number" placeholder="Nova meta">

<button onclick="setGoal()">Atualizar meta</button>

</div>


<button class="reset" onclick="resetDay()">
🔄 ZERAR DIA
</button>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
onSnapshot,
updateDoc
}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBCUefiPrAgRniWwWl705gzjc1Uf9Gi8KM0",
  authDomain: "miami-96afb.firebaseapp.com",
  projectId: "miami-96afb",
  storageBucket: "miami-96afb.firebasestorage.app",
  messagingSenderId: "357970079680",
  appId: "1:357970079680:web:a2505fee523e05d8e1e225",
  measurementId: "G-TK8LV5MB5N"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ref = doc(db,"live","controle");


let money=0;
let deliveries=0;
let goal=150;


onSnapshot(ref,(snapshot)=>{

const data=snapshot.data();

if(!data)return;

money=Number(data.ganhos)||0;

deliveries=Number(data.entregas)||0;

goal=Number(data.meta)||150;

updateScreen();

});


function updateScreen(){

document.getElementById("money").textContent=
"$"+money.toFixed(2);

document.getElementById("deliveries").textContent=
deliveries;

document.getElementById("goal").textContent=
"$"+goal.toFixed(2);

}


window.addMoney=async function(value){

money+=value;

await updateDoc(ref,{
ganhos:money
});

}


window.addDelivery=async function(){

deliveries++;

await updateDoc(ref,{
entregas:deliveries
});

}


window.removeDelivery=async function(){

if(deliveries>0)deliveries--;

await updateDoc(ref,{
entregas:deliveries
});

}


window.setMoney=async function(){

const value=
Number(document.getElementById("moneyInput").value);

if(isNaN(value))return;

money=value;

await updateDoc(ref,{
ganhos:money
});

document.getElementById("moneyInput").value="";

}


window.setGoal=async function(){

const value=
Number(document.getElementById("goalInput").value);

if(isNaN(value))return;

goal=value;

await updateDoc(ref,{
meta:goal
});

document.getElementById("goalInput").value="";

}


window.resetDay=async function(){

if(confirm("Zerar ganhos e entregas?")){

money=0;

deliveries=0;

await updateDoc(ref,{

ganhos:0,

entregas:0,

segundos:0

});

}

}

</script>

</body>
</html>
