<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.card {
  box-sizing: border-box;
  width: 100%;
  height: 100%;

  padding: 12px 16px;

  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.32);
  border-radius: 18px;

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  box-shadow:
    0 6px 22px rgba(0,0,0,0.16),
    inset 0 1px 1px rgba(255,255,255,0.22);

  color: white;
}

/* CABEÇALHO */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.label {
  font-size: 11px;
  letter-spacing: 1.5px;
  font-weight: 600;
  opacity: 0.88;
}

.percent {
  font-size: 10px;
  font-weight: 600;
  opacity: 0.72;
}

/* VALORES */
.values {
  margin-top: 5px;

  display: flex;
  align-items: baseline;
  gap: 4px;
}

.current {
  font-size: 20px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.target {
  font-size: 10px;
  opacity: 0.62;
}

/* BARRA */
.bar {
  margin-top: 8px;

  width: 100%;
  height: 4px;

  background: rgba(255,255,255,0.17);
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  width: 0%;
  height: 100%;

  border-radius: 20px;

  background: linear-gradient(
    90deg,
    #55e6df,
    #ff8fcf
  );

  box-shadow:
    0 0 8px rgba(85,230,223,0.4);

  transition: width 0.5s ease;
}
</style>
</head>

<body>

<div class="card">

  <div class="top">

    <div class="label">
      🎯 META DO DIA
    </div>

    <div class="percent" id="percent">
      0%
    </div>

  </div>

  <div class="values">

    <div class="current" id="current">
      $0.00
    </div>

    <div class="target" id="target">
      / $150.00
    </div>

  </div>

  <div class="bar">
    <div class="progress" id="progress"></div>
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBCUefiPrAgRniWwWl705gzjc1Uf9Gi8KM0",
  authDomain: "miami-96afb.firebaseapp.com",
  projectId: "miami-96afb",
  storageBucket: "miami-96afb.firebasestorage.app",
  messagingSenderId: "357970079680",
  appId: "1:357970079680:web:a2505fee523e05d8e1e225",
  measurementId: "G-TK8LV5MB5N"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ref = doc(db, "live", "controle");

onSnapshot(ref, (snapshot) => {

  const data = snapshot.data();

  if (!data) return;

  const money = Number(data.ganhos) || 0;
  const goal = Number(data.meta) || 150;

  let percentage = 0;

  if (goal > 0) {
    percentage = (money / goal) * 100;
  }

  percentage = Math.min(percentage, 100);

  document.getElementById("current").textContent =
    "$" + money.toFixed(2);

  document.getElementById("target").textContent =
    "/ $" + goal.toFixed(2);

  document.getElementById("percent").textContent =
    Math.round(percentage) + "%";

  document.getElementById("progress").style.width =
    percentage + "%";

});

</script>

</body>
</html>
