<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geração de Imagem IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div id="chat-display" class="chat-display">
            <!-- Mensagens e imagens aparecerão aqui -->
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Descreva a imagem que você quer..." autocomplete="off">
            <button id="send-btn">Gerar</button>
        </div>
    </div>

    <!-- Scripts do Firebase (Substitua pela sua configuração real, veja abaixo como pegar) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
