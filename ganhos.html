<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.widget {
  position: relative;

  width: 210px;
  height: 88px;

  box-sizing: border-box;

  padding: 15px 20px;

  /* GLASS */
  background: rgba(255,255,255,0.18);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border: 1px solid rgba(255,255,255,0.45);

  border-radius: 24px;

  box-shadow:
    0 8px 30px rgba(0,0,0,0.18);

  color: white;

  overflow: hidden;
}

/* brilho interno */

.widget::before {
  content: "";

  position: absolute;

  top: -45px;
  right: -25px;

  width: 110px;
  height: 110px;

  border-radius: 50%;

  background: rgba(255,255,255,0.16);
}

/* pequena onda */

.widget::after {
  content: "";

  position: absolute;

  bottom: -20px;
  left: -20px;

  width: 150px;
  height: 45px;

  border-radius: 50%;

  background: rgba(120,220,220,0.14);

  transform: rotate(-6deg);
}

.top {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;
  gap: 7px;

  font-size: 9px;
  font-weight: bold;

  letter-spacing: 2px;

  opacity: .75;
}

.dot {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: rgba(255,255,255,.9);
}

.money {
  position: relative;
  z-index: 2;

  margin-top: 6px;

  font-size: 31px;
  font-weight: 800;

  line-height: 1;

  letter-spacing: -.5px;
}

.bottom {
  position: relative;
  z-index: 2;

  margin-top: 5px;

  font-size: 8px;
  font-weight: bold;

  letter-spacing: 1.7px;

  opacity: .55;
}
</style>
</head>

<body>

<div class="widget">

  <div class="top">
    <div class="dot"></div>
    MIAMI · TODAY
  </div>

  <div class="money" id="money">
    $0.00
  </div>

  <div class="bottom">
    EARNINGS
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCUefiPrAgRniWwWl705gzjc1Uf9Gi8KM0",
  authDomain: "miami-96afb.firebaseapp.com",
  projectId: "miami-96afb",
  storageBucket: "miami-96afb.firebasestorage.app",
  messagingSenderId: "357970079680",
  appId: "1:357970079680:web:a2505fee523e05d8e1e225",
  measurementId: "G-TK8LV5MB5N"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ref = doc(db, "live", "controle");

onSnapshot(ref, (snapshot) => {

  const data = snapshot.data();

  if (!data) return;

  const money = Number(data.ganhos) || 0;

  document.getElementById("money")
    .textContent = "$" + money.toFixed(2);

});

</script>

</body>
</html>
