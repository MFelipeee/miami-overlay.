<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

.card{
  box-sizing:border-box;
  width:100%;
  height:100%;
  padding:18px 22px;

  background:rgba(255,255,255,0.16);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:22px;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  box-shadow:
    0 8px 30px rgba(0,0,0,0.18),
    inset 0 1px 1px rgba(255,255,255,0.25);

  color:white;
}

.label{
  font-size:12px;
  letter-spacing:1.8px;
  font-weight:600;
  opacity:.85;
  margin-bottom:7px;
}

.money{
  font-size:32px;
  line-height:1;
  font-weight:700;
  letter-spacing:-1px;
  text-shadow:0 2px 8px rgba(0,0,0,.25);
}

.today{
  margin-top:7px;
  font-size:10px;
  letter-spacing:1.5px;
  opacity:.65;
}

.glow{
  width:38px;
  height:3px;
  margin-top:13px;
  border-radius:10px;
  background:linear-gradient(
    90deg,
    #55e6df,
    #ff8fcf
  );
  box-shadow:0 0 10px rgba(85,230,223,.45);
}
</style>
</head>

<body>

<div class="card">

  <div class="label">
    💰 GANHOS
  </div>

  <div class="money" id="money">
    $0.00
  </div>

  <div class="today">
    HOJE
  </div>

  <div class="glow"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBCUefiPrAgRniWwWl705gzjc1Uf9Gi8KM0",
  authDomain: "miami-96afb.firebaseapp.com",
  projectId: "miami-96afb",
  storageBucket: "miami-96afb.firebasestorage.app",
  messagingSenderId: "357970079680",
  appId: "1:357970079680:web:a2505fee523e05d8e1e225",
  measurementId: "G-TK8LV5MB5N"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ref = doc(db,"live","controle");

onSnapshot(ref,(snapshot)=>{

  const data = snapshot.data();

  if(!data) return;

  const money = Number(data.ganhos) || 0;

  document.getElementById("money").textContent =
    "$" + money.toFixed(2);

});

</script>

</body>
</html>
