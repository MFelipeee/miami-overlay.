<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.widget {

  position: relative;

  width: 190px;
  height: 92px;

  box-sizing: border-box;

  padding: 14px 18px;

  background: rgba(250,248,242,0.88);

  border-radius: 22px;

  border: 1px solid rgba(255,255,255,0.8);

  box-shadow:
    0 8px 28px rgba(0,0,0,0.15);

  color: #18343a;

  overflow: hidden;

}

/* detalhe de água */

.widget::after {

  content: "";

  position: absolute;

  width: 120px;
  height: 35px;

  right: -35px;
  bottom: -17px;

  border-radius: 50%;

  background: rgba(75,181,181,0.13);

  transform: rotate(-8deg);

}

/* topo */

.top {

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.brand {

  font-size: 8px;

  font-weight: bold;

  letter-spacing: 2px;

  opacity: .45;

}

.sun {

  font-size: 13px;

  opacity: .45;

}

/* valor */

.money {

  margin-top: 7px;

  font-size: 30px;

  font-weight: 800;

  letter-spacing: -.5px;

  line-height: 1;

}

/* linha */

.line {

  width: 32px;

  height: 2px;

  margin-top: 8px;

  border-radius: 5px;

  background: rgba(52,166,166,.55);

}

/* rodapé */

.label {

  margin-top: 5px;

  font-size: 8px;

  font-weight: bold;

  letter-spacing: 1.6px;

  opacity: .38;

}

</style>
</head>

<body>

<div class="widget">

  <div class="top">

    <div class="brand">
      MIAMI · TODAY
    </div>

    <div class="sun">
      ☼
    </div>

  </div>

  <div class="money" id="money">
    $0.00
  </div>

  <div class="line"></div>

  <div class="label">
    EARNINGS
  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBCUefiPrAgRniWwWl705gzjc1Uf9Gi8KM0",
  authDomain: "miami-96afb.firebaseapp.com",
  projectId: "miami-96afb",
  storageBucket: "miami-96afb.firebasestorage.app",
  messagingSenderId: "357970079680",
  appId: "1:357970079680:web:a2505fee523e05d8e1e225",
  measurementId: "G-TK8LV5MB5N"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ref = doc(
  db,
  "live",
  "controle"
);


onSnapshot(ref, (snapshot) => {

  const data = snapshot.data();

  if (!data) return;

  const money =
    Number(data.ganhos) || 0;

  document.getElementById("money")
    .textContent =
      "$" + money.toFixed(2);

});

</script>

</body>
</html>
