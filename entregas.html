<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.widget {
  display: inline-flex;
  align-items: center;
  gap: 12px;

  padding: 10px 17px;

  background: rgba(255,255,255,0.90);

  border-radius: 50px;

  box-shadow: 0 6px 22px rgba(0,0,0,0.16);

  color: #18323b;
}

.icon {
  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: rgba(42,166,166,0.14);

  font-size: 17px;
}

.info {
  display: flex;
  flex-direction: column;
}

.number {
  font-size: 23px;
  font-weight: 800;
  line-height: 1;
}

.label {
  margin-top: 3px;

  font-size: 9px;
  font-weight: bold;

  letter-spacing: 1.2px;

  opacity: .5;
}
</style>
</head>

<body>

<div class="widget">

  <div class="icon">🚗</div>

  <div class="info">

    <div class="number" id="deliveries">
      0
    </div>

    <div class="label">
      ENTREGAS
    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBCUefiPrAgRniWwWl705gzjc1Uf9Gi8KM0",
  authDomain: "miami-96afb.firebaseapp.com",
  projectId: "miami-96afb",
  storageBucket: "miami-96afb.firebasestorage.app",
  messagingSenderId: "357970079680",
  appId: "1:357970079680:web:a2505fee523e05d8e1e225",
  measurementId: "G-TK8LV5MB5N"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ref = doc(db, "live", "controle");


onSnapshot(ref, (snapshot) => {

  const data = snapshot.data();

  if (!data) return;

  const deliveries =
    Number(data.entregas) || 0;

  document.getElementById("deliveries")
    .textContent = deliveries;

});

</script>

</body>
</html>
